name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (prefer 26.x for Liquid Glass, fall back to 16.4)
        run: |
          XCODE_APP=""
          for v in 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XCODE_APP="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode_16.4.app"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          echo "XCODE_USED=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: Lint localization files
        run: |
          for f in Slowed/*.lproj/Localizable.strings; do plutil -lint "$f"; done

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Slowed.xcodeproj \
            -target Slowed \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|\*\* BUILD" || true
          test -d build/Release-iphoneos/Slowed.app

      - name: Show errors
        if: failure()
        run: grep -n -E "error:" xcodebuild.log | head -100 || true

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Release-iphoneos/Slowed.app Payload/
          zip -qry Slowed.ipa Payload
          ls -la Slowed.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slowed-ipa
          path: Slowed.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Slowed 1.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            IPA sin firmar para instalar con AltStore / SideStore.
            Commit: ${{ github.sha }}
            Compilado con ${{ env.XCODE_USED }} (runner macos-15-intel).
          files: Slowed.ipa
